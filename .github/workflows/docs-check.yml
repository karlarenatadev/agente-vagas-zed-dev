name: Docs Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar documentos principais
        shell: bash
        run: |
          test -f README.md
          test -f docs/checklist.md
          test -f docs/frontend-qa-checklist.md
          echo "Documentos principais encontrados."