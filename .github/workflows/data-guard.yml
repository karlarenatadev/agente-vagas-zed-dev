name: Data Guard

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  data-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos sensíveis em data/
        shell: bash
        run: |
          echo "Verificando arquivos sensíveis rastreados pelo Git..."

          SENSITIVE_FILES=$(git ls-files data | grep -E 'data/(user-profile|resume-analysis|job-description-analysis|resume-match-report|resume-tailoring-suggestions|pdi-plan|interview-session|applications)\.(md|json)$' || true)

          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Arquivos sensíveis rastreados encontrados:"
            echo "$SENSITIVE_FILES"
            echo ""
            echo "Remova esses arquivos do rastreamento com:"
            echo "git rm --cached -r data"
            echo ""
            echo "Mantenha apenas data/.gitkeep, data/README.md ou exemplos sanitizados."
            exit 1
          fi

          echo "Nenhum arquivo sensível de runtime encontrado no Git."